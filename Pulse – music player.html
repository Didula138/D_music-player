<style>

:root[data-theme="dark"]{--bg:#070a09;--panel:#121715;--ink:#eef3f0;--mute:#93a09a;--line:#222b27;--acc:#1ed760;--accink:#04120a;--hov:#1b2320}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}

.side,.main,.bar{background:var(--panel);border-radius:12px}

.np{display:none;background:var(--panel);border-radius:12px;padding:20px;overflow:auto}
.npart{position:relative;aspect-ratio:1;border-radius:10px;background:var(--hov);margin-bottom:16px;transition:border-radius .7s,box-shadow .12s;scale:calc(1 + var(--lvl,0)*.05);box-shadow:0 0 calc(8px + var(--lvl,0)*70px) hsl(var(--h,150) 70% 50% / calc(.1 + var(--lvl,0)*.7))}

.np.pz .npart{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}

.nphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.bmin2{color:var(--mute);width:28px;height:28px;font-size:16px}

@media (min-width:1100px){
.app.mn .np{padding:12px 8px}
.app.mn .np>:not(.nphead){display:none}
.app.mn .nphead{justify-content:center;margin:0}
.app.mn .nphead span{display:none}
}
.app.mb .bar{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));grid-template-columns:auto auto auto;gap:12px;padding:8px 12px;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3)}

.app.mb .main{padding-bottom:84px}
.viz{display:block;width:100%;height:64px;margin-top:14px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}

.eq b:nth-child(2){animation-delay:-.3s}.eq b:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.app.playing .btns .play{animation:ring 2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.row.in{animation:rowin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes rowin{from{opacity:0;translate:-18px 0}}
#nlike[aria-pressed=true]{animation:pop .45s}
@keyframes pop{0%{scale:1}40%{scale:1.6}100%{scale:1}}

.row,.nav button,.big,.btns .play{transition:background .2s,transform .2s,color .2s}
.logo{background:linear-gradient(90deg,var(--ink),var(--acc),var(--ink));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}

.app{transition:--h .9s}
.main{background:linear-gradient(180deg,hsl(var(--h) 55% 42%/.28),transparent 280px),var(--panel)}
.bar{isolation:isolate}
.bviz{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;z-index:-1;opacity:.25;pointer-events:none;border-radius:12px}
#nart{transition:border-radius .6s;box-shadow:0 0 calc(2px + var(--lvl,0)*22px) hsl(var(--h,150) 70% 50%/calc(.15 + var(--lvl,0)*.7));scale:calc(1 + var(--lvl,0)*.12)}

@keyframes sheetup{from{translate:0 100%}}
@media (max-width:1099px){

}
.app{position:relative;isolation:isolate}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}

.bl:nth-child(3){left:12vw;bottom:-22vmax;background:hsl(calc(var(--h) - 60) 85% 50%);animation-duration:25s,12s;animation-delay:-14s,0s}
@keyframes drift{to{transform:translate(9vw,7vh) scale(1.15) rotate(40deg)}}
@keyframes morph{50%{border-radius:60% 40% 35% 65%/45% 60% 40% 55%}}
.side,.main,.bar,.np{background:color-mix(in srgb,var(--panel) 40%,transparent);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid color-mix(in srgb,#fff 28%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent),inset 0 -1px 0 color-mix(in srgb,#fff 8%,transparent),0 12px 40px rgba(0,0,0,.16)}
.main{background:linear-gradient(180deg,hsl(var(--h) 65% 52%/.22),transparent 260px),color-mix(in srgb,var(--panel) 40%,transparent)}
.side,.np{position:relative}
.side::after,.bar::after,.np::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0),rgba(255,255,255,.18),transparent 65%);opacity:var(--sp,0);transition:opacity .3s}
.app.mb .bar{border-color:color-mix(in srgb,#fff 30%,transparent);border-radius:999px;box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent),0 12px 36px rgba(0,0,0,.35)}
.nav button[aria-current=true]{background:color-mix(in srgb,#fff 18%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 40%,transparent)}
.up,input[type=search]{background:color-mix(in srgb,#fff 14%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,#fff 30%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent)}
.big{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.btns .play{background:color-mix(in srgb,var(--ink) 88%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.big,.btns .play,.up,.btns button{transition:scale .4s cubic-bezier(.3,1.9,.5,1),transform .2s,background .2s,color .2s}
.track i{transition:height .25s;border-radius:4px}
.track:hover i{height:8px}
.track b{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));box-shadow:0 0 12px var(--acc)}
.cover{border-radius:42% 58% 60% 40%/50% 40% 60% 50%;box-shadow:0 12px 40px hsl(var(--h) 70% 50%/.45);animation:morph 10s ease-in-out infinite}
@media (max-width:760px){.bl{filter:blur(50px)}}
.bar{view-transition-name:bar}
.np{view-transition-name:np}
::view-transition-group(bar),::view-transition-group(np){animation-duration:.6s;animation-timing-function:cubic-bezier(.34,1.45,.5,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
.novt .app.mb .bar{animation:pillin .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes pillin{from{scale:.5;opacity:0;translate:0 30px}}
.sw{animation:swap .55s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;translate:0 12px;filter:blur(6px)}}
.pt{position:fixed;z-index:60;pointer-events:none;left:var(--x);top:var(--y);color:var(--acc);font-size:15px;animation:burst .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{to{translate:var(--dx) var(--dy);opacity:0;scale:.4}}
.row,.big,.btns .play,.up,.nav button{position:relative;overflow:hidden}
.rp{position:absolute;width:12px;height:12px;border-radius:50%;pointer-events:none;translate:-50% -50%;background:color-mix(in srgb,var(--acc) 45%,transparent);animation:rp .6s ease-out forwards}
@keyframes rp{to{scale:var(--s,24);opacity:0}}
.row.on{box-shadow:inset 3px 0 0 var(--acc);background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,transparent),transparent)}
.main.drag{animation:dz 1.1s ease-in-out infinite}
@keyframes dz{50%{outline-offset:-16px}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.studio{position:fixed;z-index:40;right:12px;bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 24px));padding:16px;border-radius:20px;background:color-mix(in srgb,var(--panel) 55%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid color-mix(in srgb,#fff 30%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent),0 20px 60px rgba(0,0,0,.35);opacity:0;visibility:hidden;scale:.9;translate:0 24px;filter:blur(10px);transform-origin:bottom right;transition:opacity .35s,scale .5s cubic-bezier(.34,1.5,.5,1),translate .5s cubic-bezier(.34,1.5,.5,1),filter .35s,visibility 0s .5s}

.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.sh2{margin:14px 0 8px;font-weight:600}
.pre{display:flex;flex-wrap:wrap;gap:6px}

.eqs{display:grid;gap:8px;margin-top:12px}

.studio .a{margin-top:8px}

.btns button[aria-pressed=true]{animation:pop .4s}
.art,.cover{display:grid;place-items:center;line-height:1;overflow:hidden}
.art{font-size:21px}.qi .art{font-size:17px}.cover{font-size:60px}
.npart{display:grid;place-items:center;font-size:clamp(64px,8vw,110px);line-height:1}
.npart.emo::after{display:none}
.np.sheet .npart{font-size:96px}
.studio.ic{left:50%;top:50%;right:auto;bottom:auto;translate:-50% calc(-50% + 24px);transform-origin:center}

.icprev{width:96px;height:96px;border-radius:22px;font-size:48px;margin:0 auto 6px}
.chip.em{font-size:18px;padding:4px 9px}
.np .chip{margin-top:10px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 4px}
.rnd{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,#fff 14%,transparent);border:1px solid color-mix(in srgb,#fff 28%,transparent)}

<body>

<script>
const SC={min:[0,3,5,7,10],maj:[0,2,4,7,9],dor:[0,2,3,7,9]};
const T=[
["Night Drive","Kestrel Lane","Late night",45,"min",92,"sawtooth",11,150],
["Low Tide","Mara Vale","Focus",50,"dor",72,"sine",23,200],
["Paper Lanterns","Hollow Pines","Focus",52,"maj",84,"triangle",35,30],
["Afterglow","Kestrel Lane","Late night",48,"min",100,"triangle",47,320],
["Overclock","Neon Orchard","Boost",52,"min",128,"square",59,350],
["Sunday Static","Mara Vale","Focus",55,"maj",76,"sine",61,50],
["Redline","Neon Orchard","Boost",47,"dor",132,"sawtooth",73,10],
["Glass Hours","Hollow Pines","Late night",50,"dor",88,"sine",85,260]
].map((a,i)=>({id:i,t:a[0],ar:a[1],pl:a[2],root:a[3],sc:a[4],bpm:a[5],w:a[6],seed:a[7],h:a[8]}));
const VIEWS=["Home","All songs","Focus","Late night","Boost","Uploads","Recent","Liked"];
const $=id=>document.getElementById(id);
let likes=new Set();

const saveLikes=()=>{try{localStorage.setItem("pulse-likes",JSON.stringify([...likes]))}catch(e){}};
let view="Home",query="",cur=null,step=0,playing=false,shuf=false,rep=0,ctx,master,timer;
const grad=h=>`linear-gradient(135deg,hsl(${h} 65% 48%),hsl(${(h+55)%360} 70% 28%))`;
const dur=t=>64*60/t.bpm/2;

function list(){const f=T.filter(t=>(view==="All songs"||view==="Home"||view==="Recent"||(view.startsWith("Daily")?T.indexOf(t)%3===+view.slice(-1)-1:view.startsWith("Radio: ")?t.ar===view.slice(7):view==="Liked"?likes.has(t.id):t.pl===view))&&(t.t+" "+t.ar).toLowerCase().includes(query));return view==="Recent"?snap.map(id=>f.find(t=>t.id===id)).filter(Boolean):f}

function tick(){

let src,started,tt,bus,nextT=0;
function killSrc(){if(src){try{src.stop()}catch(e){}src.disconnect();src=null}if(bus){bus.disconnect();bus=null}}

function load(t){clearTimeout(timer);killSrc();cur=t;pushHist(t.id);mel(t);step=0;playing=true;ensure();tick();paint()}
function toggle(){
  if(!cur){const l=list();if(l.length)load(l[0]);return}
  if(playing){playing=false;clearTimeout(timer);rewind();killSrc()}else{playing=true;ensure();tick()}
  paint();
}
function next(auto){
  const l=list();if(!l.length)return;
  const i=l.indexOf(cur);
  if(auto&&rep===0&&!shuf&&i===l.length-1){playing=false;clearTimeout(timer);step=0;paint();return}
  let n=l[(i+1)%l.length];
  if(shuf&&l.length>1){do n=l[Math.floor(Math.random()*l.length)];while(n===cur)}
  load(n);
}
function prev(){
  const l=list();if(!cur||!l.length)return;
  if(step*60/cur.bpm/2>3){step=0;if(playing){killSrc();clearTimeout(timer);tick()}else paint();return}
  const i=l.indexOf(cur);load(l[(i<=0?l.length:i)-1]);
}
function paint(){
  $("pp").innerHTML=playing?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  $("pp").setAttribute("aria-label",playing?"Pause":"Play");
  if(cur){
    $("nt").textContent=cur.t;$("na").textContent=cur.ar;paintArt();
    const D=dur(cur);$("fill").style.width=step/64*100+"%";$("cur").textContent=fmt(step/64*D);$("tot").textContent=fmt(D);
    $("trk").setAttribute("aria-valuenow",Math.round(step/64*100));
    $("nlike").setAttribute("aria-pressed",likes.has(cur.id));
  }
  document.querySelectorAll(".row").forEach(r=>{const on=cur&&+r.dataset.id===cur.id;r.classList.toggle("on",on);const n=r.querySelector(".n");if(on&&playing){if(!n.firstElementChild)n.innerHTML='<i class="eq"><b></b><b></b><b></b></i>'}else n.textContent=+r.dataset.n+1});
  sync();
}
function render(){
  document.body.classList.toggle("ishome",view==="Home");if(view==="Home")drawHome();
  const l=list();
  $("vt").textContent=view;if(anim){$("vt").classList.remove("sw");void $("vt").offsetWidth;$("vt").classList.add("sw")}$("vc").textContent=l.length+(l.length===1?" song":" songs");
  $("cover").style.background=l.length?artBg(l[0]):"var(--hov)";$("cover").textContent=l.length?artIn(l[0]):"";
  $("list").innerHTML=l.length?l.map((t,i)=>`<div class="row${anim?" in":""}" style="--i:${i}" data-id="${t.id}" data-n="${i}" tabindex="0"><span class="n">${i+1}</span><div class="who"><div class="art" style="background:${artBg(t)}">${artIn(t)}</div><div style="min-width:0"><div class="t">${esc(t.t)}</div><div class="a">${esc(t.ar)}</div></div></div><span class="pl">${t.pl}</span><span class="d">${fmt(dur(t))}</span><span class="acts"><button class="del" data-ic="${t.id}" aria-label="Edit icon for ${esc(t.t)}">✎</button><button class="like" data-like="${t.id}" aria-label="Like ${esc(t.t)}" aria-pressed="${likes.has(t.id)}">♥</button>${t.up?`<button class="del" data-del="${t.id}" aria-label="Remove ${esc(t.t)}">✕</button>`:""}</span></div>`).join(""):`<div class="empty">${view==="Liked"?"Tap the heart on a song to save it here.":view==="Uploads"&&!query?"Drop audio files here or choose Upload music. MP3, M4A, MP4, WAV and OGG work.":view==="Recent"&&!query?"Songs you play will show up here.":"No songs match your search."}</div>`;
  anim=0;renderPanel();paint();
}
function nav(){$("nav").innerHTML=VIEWS.map(v=>`<button data-v="${v}" aria-current="${v===view}"><i class="ni" style="background:${PH[v]||grad(150)}"></i>${v}</button>`).join("")}
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;go(b.dataset.v)};
$("list").onclick=e=>{
  const ed=e.target.closest("[data-ic]");
  if(ed){openIcon(+ed.dataset.ic);return}
  const dl=e.target.closest("[data-del]");
  if(dl){remove(+dl.dataset.del);return}
  const lk=e.target.closest("[data-like]");
  if(lk){const id=+lk.dataset.like;likes.has(id)?likes.delete(id):likes.add(id);saveLikes();render();return}

  const t=T.find(x=>x.id===+r.dataset.id);t===cur?toggle():load(t);
};
$("list").onkeydown=e=>{if(e.key==="Enter"&&e.target.classList.contains("row"))e.target.click()};
$("q").oninput=e=>{query=e.target.value.toLowerCase();if(query&&view==="Home")go("All songs");else render()};
$("bigplay").onclick=()=>{const l=list();if(l.length)(cur&&l.includes(cur)&&playing)?toggle():load(cur&&l.includes(cur)?cur:l[0])};
$("pp").onclick=toggle;$("next").onclick=()=>next(false);$("prev").onclick=prev;
$("shuf").onclick=()=>{shuf=!shuf;$("shuf").setAttribute("aria-pressed",shuf)};
$("rep").onclick=()=>{rep=(rep+1)%3;$("rep").setAttribute("aria-pressed",rep>0);$("rep").setAttribute("aria-label","Repeat: "+["off","all","one"][rep]);$("rep").style.opacity=rep===2?.7:1};
$("nlike").onclick=()=>{if(!cur)return;likes.has(cur.id)?likes.delete(cur.id):likes.add(cur.id);saveLikes();render()};
$("vol").oninput=applyGain;
$("trk").onclick=e=>{if(!cur)return;const b=$("trk").getBoundingClientRect();step=Math.floor(Math.min(.999,Math.max(0,(e.clientX-b.left)/b.width))*64);if(playing){killSrc();clearTimeout(timer);tick()}else paint()};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle()}});
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("pulse",1);r.onupgradeneeded=()=>r.result.createObjectStore("songs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbDo(mode,fn){try{const d=await idb();return await new Promise((res,rej)=>{const tx=d.transaction("songs",mode),q=fn(tx.objectStore("songs"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})}catch(e){return null}}
function addUp(r){T.push({id:r.id,t:r.t,ar:r.ar,pl:"Uploads",h:r.h,bpm:64*30/r.dur,up:1,blob:r.blob,img:r.img||""})}
async function addFiles(fs){
  ensure();let ok=0;
  for(const f of fs){
    if(!(/^(audio|video)\//.test(f.type)||/\.(mp3|m4a|wav|ogg|flac|aac|opus|webm|mp4|m4v|mov)$/i.test(f.name))){toast("Skipped "+f.name+" — not an audio or MP4 file");continue}

function remove(id){

}
const mn=document.querySelector(".main");
mn.ondragover=e=>{e.preventDefault();mn.classList.add("drag")};
mn.ondragleave=e=>{if(e.target===mn)mn.classList.remove("drag")};
mn.ondrop=e=>{e.preventDefault();mn.classList.remove("drag");addFiles([...e.dataTransfer.files])};

let mdFor=null;const art={};
function artURL(h){if(art[h])return art[h];const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,`hsl(${h} 65% 48%)`);g.addColorStop(1,`hsl(${(h+55)%360} 70% 28%)`);x.fillStyle=g;x.fillRect(0,0,256,256);return art[h]=c.toDataURL("image/png")}

function renderPanel(){

function sync(){

  const npEl=document.querySelector(".np");npEl.classList.toggle("live",!!cur);npEl.classList.toggle("pz",!playing);appEl.classList.toggle("playing",playing);appEl.classList.toggle("has",!!cur);
